name: Frontend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
      - 'ecosystem.config.js'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    name: Build & Lint
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint -- --max-warnings=0 || true

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Pull & build in project directory
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          cd /home/phamhai/hr/hr_project
          git fetch origin main
          git reset --hard origin/main
          cd frontend
          npm ci
          npm run build

      - name: Reload PM2 (zero-downtime)
        run: |
          cd /home/phamhai/hr/hr_project
          pm2 reload ecosystem.config.js --only hr-frontend --update-env || pm2 start ecosystem.config.js --only hr-frontend
          pm2 save

      - name: Smoke test frontend
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "302" ]; then
              echo "Frontend healthy (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code — retrying..."
            sleep 1
          done
          echo "Frontend smoke test failed after 30s"
          pm2 logs hr-frontend --lines 30 --nostream
          exit 1
