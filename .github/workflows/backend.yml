name: Backend CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'ecosystem.config.js'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

env:
  NODE_VERSION: '20'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 7d
          BCRYPT_SALT_ROUNDS: 4
          PORT: 3001
        run: npm test -- --passWithNoTests

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Pull & build in project directory
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd /home/dcorp/hr
          git fetch origin main
          git reset --hard origin/main
          cd backend
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: Reload PM2 (zero-downtime)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          FRONTEND_OAUTH_REDIRECT_URL: ${{ secrets.FRONTEND_OAUTH_REDIRECT_URL }}
        run: |
          cd /home/dcorp/hr
          pm2 reload ecosystem.config.js --only hr-backend --update-env || pm2 start ecosystem.config.js --only hr-backend
          pm2 save

      - name: Smoke test backend health
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "Backend healthy"
              curl -s http://localhost:3001/api/v1/health
              exit 0
            fi
            echo "Attempt $i: HTTP $code — retrying..."
            sleep 1
          done
          echo "Backend health check failed after 30s"
          pm2 logs hr-backend --lines 50 --nostream
          exit 1
